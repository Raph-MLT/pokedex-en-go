<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pokédex</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Pokédex</h1>
    <form action="/pokemon" method="GET">
        <input type="text" name="nom" value="{{.Nom}}" placeholder="Nom du Pokémon">
        <button type="submit">Rechercher</button>
    </form>
    <ul class="liste">
        {{range .Pokemons}}
        <li>
            <a href="/pokemon/{{.PokedexID}}">
                <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}" width="96">
                <span>n°{{.PokedexID}}</span>
                <strong>{{.Name.Fr}}</strong>
            </a>
        </li>
        {{else}}
        <li>Aucun Pokémon ne correspond à « {{.Nom}} ».</li>
        {{end}}
    </ul>
    <footer>Données fournies par <a href="https://tyradex.app">Tyradex</a></footer>
</body>
</html>
